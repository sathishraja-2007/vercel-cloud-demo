
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vercel Cloud Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      text-align: center;
      padding: 70px 20px;
    }
    main {
      background: white;
      max-width: 550px;
      margin: auto;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #0001;
    }
    button {
      background: #111;
      color: white;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>My Website Updated Through the Cloud</h1>
    <p>This website is hosted using Vercel.</p>
    <p>Cloud Computing Demonstration</p>
    <button onclick="alert('My website is working!')">
      Test Website
    </button>
  </main>
</body>
</html>
